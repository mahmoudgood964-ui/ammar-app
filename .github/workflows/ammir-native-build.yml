name: AMMIR Native Android and iOS Builds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ammir-native-build.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ammir-native-build.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build bundled AMMIR web app
        run: |
          npm run build:web
          npm run verify:web

      - name: Generate Android project
        run: npx cap add android

      - name: Generate native Android icon and splash assets
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor "#102f29" --splashBackgroundColor "#102f29"

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Apply AMMIR Android native configuration
        run: npm run prepare:android

      - name: Build installable debug APK and release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ammir-android-builds
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios-simulator:
    name: iOS Simulator build
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build bundled AMMIR web app
        run: |
          npm run build:web
          npm run verify:web

      - name: Generate iOS project
        run: npx cap add ios

      - name: Generate native iOS icon and splash assets
        run: npx capacitor-assets generate --ios --assetPath assets --iconBackgroundColor "#102f29" --splashBackgroundColor "#102f29"

      - name: Synchronize Capacitor iOS project
        run: npx cap sync ios

      - name: Apply AMMIR iOS privacy descriptions and app identity
        run: npm run prepare:ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          cd build/ios/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/mobile/ammir-ios-simulator.zip"

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ammir-ios-simulator
          if-no-files-found: error
          path: mobile/ammir-ios-simulator.zip
