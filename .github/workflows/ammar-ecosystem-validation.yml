name: AMMAR ecosystem validation

on:
  push:
    branches:
      - main
      - feature/ammar-market-messaging
      - feature/ammir-revenue-engine-v1
      - launch/ammir-trust-hardening
      - fix/ammir-android-pwa-install
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ammar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ammar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create Supabase-compatible database fixtures
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-db-bootstrap.sql
      - name: Apply marketplace and messaging foundation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611120006_ammar_marketplace_messaging.sql
      - name: Apply advanced messaging migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611120007_ammar_messaging_plus.sql
      - name: Harden pinned-message conversation scope
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125091500_harden_pinned_message_conversation_scope.sql
      - name: Apply AMMIR storage and Realtime migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112140000_ammir_storage_realtime.sql
      - name: Optimize AMMIR RLS policies
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112142000_optimize_ammir_rls_policies.sql
      - name: Apply AMMIR trust and admin access hardening
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112200000_ammir_trust_and_admin_access.sql
      - name: Apply AMMIR provider verification audit migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112203000_ammir_provider_verification_audit.sql
      - name: Enforce verified-provider transaction gates
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112210000_ammir_verified_provider_transaction_gate.sql
      - name: Disable unapproved commission defaults
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112204500_disable_unapproved_commission_defaults.sql
      - name: Verify AMMIR commission defaults
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-commission-defaults.sql
      - name: Run AMMIR trust and admin permission tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-trust-admin.sql
      - name: Run marketplace integration tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-marketplace-integration.sql
      - name: Run advanced messaging integration tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-messaging-plus.sql
      - name: Run storage and Realtime integration checks
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-storage-realtime.sql
      - name: Apply AMMIR BOQ, RFQ, awards and delivery workflow migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261113090000_ammir_boq_rfq_awards_delivery.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091000_ammir_workflow_rls_and_indexes.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261113092000_ammir_verified_provider_gates_and_quote_totals.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261113093000_ammir_workflow_state_guards.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261113094000_ammir_workflow_fk_indexes.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261113100000_ammir_execution_state_guards.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125103000_add_admin_operational_alerts.sql
      - name: Run AMMIR project execution workflow integration tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-project-workflows.sql
      - name: Apply AMMIR security defense-in-depth migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261116210000_ammir_security_defense_in_depth.sql
      - name: Apply paused payment table deny policies
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261116211825_explicit_deny_policies_for_paused_payment_tables.sql
      - name: Consolidate AMMIR admin and owner RLS policies
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117081000_consolidate_admin_permissive_rls_policies.sql
      - name: Test AMMIR consolidated RLS policies
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-rls-policy-consolidation.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-trust-admin.sql
      - name: Move authenticated SECURITY DEFINER implementations to app_private
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117083000_move_authenticated_definer_rpcs_to_app_private.sql
      - name: Verify AMMIR private RPC wrappers and access
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-security-hardening.sql
      - name: Smoke-test authenticated and administrator public RPC wrappers
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-private-rpc-smoke.sql
          psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammar-trust-admin.sql
      - name: Test AMMIR account role isolation after final RLS hardening
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-account-role-isolation.sql
      - name: Test AMMIR admin operational alert authorization
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-admin-operational-alerts.sql
      - name: Install AMMIR project award and delivery commission triggers
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117222827_add_project_award_and_delivery_commission_ledger.sql
      - name: Apply AMMIR append-only commission adjustments migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124211500_add_ammir_commission_adjustments.sql
      - name: Protect paid AMMIR commission ledger rows
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124230000_protect_paid_commission_ledger_rows.sql
      - name: Re-run project workflows against paid commission triggers
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-project-workflows.sql
      - name: Test AMMIR revenue engine schema and authorization
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ammar_test -v ON_ERROR_STOP=1 -f tests/ammir-revenue-engine.sql
      - name: Test concurrent AMMIR commission reductions
        env:
          PGPASSWORD: postgres
        run: bash tests/ammir-revenue-concurrency.sh
      - name: Validate browser code and migration wiring
        run: node tests/check-ammar-app.mjs
      - name: Test AMMIR service worker lifecycle and cache boundaries
        run: node tests/ammir-service-worker.test.mjs
